<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460"><rect width="760" height="460" rx="26" fill="#123f36"/><g font-family="system-ui, sans-serif" text-anchor="middle"><text x="380" y="45" font-size="26" font-weight="800" fill="#fff0bc">一次点击 = 一圈任务</text><rect x="170" y="92" width="420" height="240" rx="22" fill="none" stroke="#ebca81" stroke-width="30"/><path d="M190 212 V112 H570 V312 H270" stroke="#fff8de" stroke-width="4" fill="none" stroke-dasharray="13 10"/><path d="M374 99 l18 13 -18 13 M557 205 l13 18 13 -18 M390 299 l-18 13 18 13" fill="#fff8de"/><rect x="235" y="142" width="290" height="135" rx="14" fill="#163342"/><text x="380" y="183" fill="#fff2bd" font-size="21">四边朝内，沿射线点亮</text><text x="380" y="218" fill="#bde2d0" font-size="18">同一射线每次经过最多一格</text><text x="380" y="249" fill="#bde2d0" font-size="18">返程不射击，不会自动续圈</text><rect x="170" y="365" width="420" height="65" rx="14" fill="#8f643c" stroke="#f4dfac" stroke-width="3"/><text x="380" y="392" font-size="19" fill="#fff2d4">有余弹 → 回到原列队尾</text><text x="380" y="417" font-size="16" fill="#fff2d4">再次点击才出发 · 弹药为零仍按原规则退场</text><path d="M245 332 V360" stroke="#fff1bd" stroke-width="6"/><path d="M233 347 l12 16 12 -16" fill="#fff1bd"/><circle cx="204" cy="312" r="26" fill="#f9cf39" stroke="#fff4be" stroke-width="3"/><text x="204" y="319" font-size="18" fill="#594322" font-weight="800">萌宠</text></g></svg>
